<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦国シミュレーター</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a222d;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 10px 20px;
        }

        header {
            text-align: center;
            height: 50px;
        }
        h1 {
            color: #f1c40f;
            margin: 0;
            font-size: 24px;
        }

        #game-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
            margin-bottom: 10px;
        }

        #map-wrapper {
            flex: 3;
            height: 100%;
            position: relative;
            overflow: hidden;
            border: 4px solid #3d4e5d;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background-color: #1a222d;
        }
        #map-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #map-canvas:active {
            cursor: grabbing;
        }

        #nav-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            color: #f1c40f;
            pointer-events: none;
            z-index: 10;
        }

        /* 総戦力ランキングボックスのスタイル */
        #ranking-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(11, 13, 16, 0.85);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #3d4e5d;
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
            min-width: 140px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #ranking-title {
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #3d4e5d;
            padding-bottom: 3px;
            font-size: 13px;
        }
        .ranking-item {
            margin: 3px 0;
            display: flex;
            justify-content: space-between;
        }

        #sidebar {
            flex: 1.2;
            background-color: #15191d;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .status-box {
            border-bottom: 2px solid #2c353f;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .status-box h2, .status-box h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .status-item {
            font-size: 15px;
            margin: 5px 0;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }

        #castle-detail {
            min-height: 160px;
        }

        #log-title {
            margin: 5px 0;
            font-size: 14px;
            color: #f1c40f;
        }
        #log {
            flex: 1;
            min-height: 80px;
            overflow-y: auto;
            background-color: #0b0d10;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            color: #bdc3c7;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ecc71;
        }
        .btn:disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
            color: #bdc3c7;
        }
        .btn2 {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            height: 40px;
            width: 80px;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn2:hover {
            background-color: #2ecc71;
        }
        .btn2:disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
            color: #bdc3c7;
        }

        #start-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 13, 16, 0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .start-modal {
            background: #15191d;
            padding: 30px;
            border-radius: 8px;
            border: 3px solid #3d4e5d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .start-modal select {
            width: 100%;
            padding: 10px;
            background: #0b0d10;
            color: #fff;
            border: 2px solid #3d4e5d;
            border-radius: 4px;
            font-size: 16px;
            margin: 15px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid;
        }
    </style>
</head>
<body>

    <div id="start-modal-overlay">
        <div class="start-modal">
            <h2 style="color: #f1c40f; margin-top: 0;">いざ、出陣の刻</h2>
            <p style="font-size: 14px; color: #bdc3c7; line-height: 1.5;">御身が率いる大名家を選択してください。</p>
            <select id="player-select-daimyo"></select>
            <button class="btn" style="background-color: #e74c3c; font-size: 16px; font-weight: bold; padding: 12px;" onclick="startGameWithSelectedDaimyo()">この勢力で天下を統べる</button>
        </div>
    </div>

    <div id="app-wrapper">
        <header>
            <h1>〜日ノ本大戦〜</h1>
        </header>

        <div id="game-container">
            <div id="map-wrapper">
                <div id="ranking-box">
                    <div id="ranking-title">🏆 総兵力上位</div>
                    <div id="ranking-list"></div>
                </div>

                <div id="nav-hint">操作: ホイールで拡大縮小 / ドラッグで移動</div>
                <canvas id="map-canvas" width="1000" height="800"></canvas>
                <button class="btn2" id="end-turn-btn" style="background-color: #e74c3c; font-weight: bold; margin-top: 10px;" onclick="endPlayerTurn()">番終了</button>
            </div>

            <div id="sidebar">
                <div class="status-box">
                    <h2>天下の情勢</h2>
                    <div class="status-item" style="color: #f1c40f; font-weight: bold;">現在のターン: <span id="current-turn-display">1</span></div>
                    <div class="status-item">支配地域: <span id="player-castles">0</span> / <span id="total-castles-count">65</span></div>
                </div>

                <div class="status-box" id="warning-box" style="background-color: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; padding: 8px; border-radius: 4px; display: none;">
                    <h4 style="margin: 0 0 5px 0; color: #ff7675;">⚠️ 敵襲・進軍警告</h4>
                    <div id="warning-text" style="font-size: 12px; color: #fab1a0;"></div>
                </div>

                <div class="status-box">
                    <h2>城情報</h2>
                    <div id="castle-detail">
                        <p>マップ上の城をクリックしてください。</p>
                    </div>
                </div>

                <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                    <div id="log-title">戦況報告</div>
                    <div id="log"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="castles.js"></script>
    <script src="generals.js"></script>
    <script src="map.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
